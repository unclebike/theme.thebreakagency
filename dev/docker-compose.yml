# Local development stack for The Break.
# Ghost 6 (matches prod 6.72) + MySQL 8 + Mailpit (catches member/magic-link emails).
# The theme repo is mounted live as the "snook" theme (same name as production).
#
#   docker compose -f dev/docker-compose.yml up -d
#   Ghost:   http://localhost:2368   (admin: /ghost)
#   Mailpit: http://localhost:8025
#
# Credentials below are local-only throwaway values.

name: thebreak-dev

services:
  ghost:
    image: ghost:6.72
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2368:2368"
    environment:
      NODE_ENV: development
      url: http://localhost:2368
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ghost-dev
      database__connection__database: ghost
      mail__transport: SMTP
      mail__from: "The Break (dev) <dev@thebreak.localhost>"
      mail__options__host: mailpit
      mail__options__port: 1025
      mail__options__secure: "false"
      mail__options__ignoreTLS: "true"
      security__staffDeviceVerification: "false"
    volumes:
      - ghost-content:/var/lib/ghost/content
      - ..:/var/lib/ghost/content/themes/snook

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-dev
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ghost-dev
    volumes:
      - ghost-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-dev"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  ghost-content:
  ghost-db:
